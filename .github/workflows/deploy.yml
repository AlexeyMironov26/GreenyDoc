name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run backend tests
        run: |
          pip install pytest pytest-cov
          pytest tests/ --cov=. --cov-fail-under=50 || true
        env:
          SECRET_KEY: test_key
          PLANT_ID_API_KEY: test_key
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install frontend dependencies
        run: npm install
      
      - name: Run frontend tests
        run: npm run test -- --passWithNoTests || true
      
      - name: Build backend Docker image
        run: docker build -t greenydoc-backend ./backend
      
      - name: Build frontend Docker image
        run: docker build -t greenydoc-frontend ./react
    
      - name: Create .env file
        run: |
          echo "SECRET_KEY=test_secret_key_for_ci" >> .env
          echo "PLANT_ID_API_KEY=test_plant_id_key" >> .env
          echo "MINIO_ACCESS_KEY=minioadmin" >> .env
          echo "MINIO_SECRET_KEY=minioadmin123" >> .env
          echo "MINIO_ENDPOINT=minio:9000" >> .env
          echo "MINIO_BUCKET=greenydoc" >> .env
          echo "MINIO_SECURE=false" >> .env

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          sleep 30
          docker compose ps
      
      - name: Debug backend logs
        run: |
          echo "=== BACKEND LOGS ==="
          docker compose logs backend
          echo "=== BACKEND HEALTH CHECK ==="
          curl -f http://localhost:8000/health/live || echo "Health check failed"

      - name: Check if containers are running
        run: |
          docker ps --filter "status=running" --format "table {{.Names}}\t{{.Status}}"
      
      # - name: Check health endpoints
      #   run: |
      #     curl -f http://localhost:8000/health/live || exit 1
      #     curl -f http://localhost:5173 || exit 1
      
      - name: Stop services
        run: docker compose down